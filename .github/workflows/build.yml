name: StarNote Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node deps
        run: npm ci --no-audit --no-fund || npm install

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_BASE: https://api.starnote.app
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Install Capacitor
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Create Capacitor Project
        run: |
          echo "Creating Capacitor project..."
          npx cap init "StarNote" "com.starnote.app" --web-dir=.next || true

      - name: Add Android Platform
        run: |
          echo "Adding Android platform..."
          npx cap add android || echo "Android already exists"

      - name: Sync Capacitor
