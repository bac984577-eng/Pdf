# ─────────────────────────────────────────────────────────────
#  مِداد — بناء تطبيق أندرويد (APK) عبر GitHub Actions
#  يغلّف هذا السير تطبيق الويب داخل غلاف أندرويد أصلي (Capacitor).
#
#  ⚙️ خطوة واحدة مطلوبة قبل التشغيل:
#  أضف Secret باسم APP_URL يحتوي رابط التطبيق المنشور
#  (Settings → Secrets and variables → Actions → New repository secret)
#  مثال:  https://midad.vercel.app
# ─────────────────────────────────────────────────────────────
name: 📱 بناء APK

on:
  push:
    branches: [main]
  workflow_dispatch: # تشغيل يدوي من تبويب Actions

jobs:
  build-apk:
    name: بناء APK وتوقيعه
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}

    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      - name: 🟢 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🤖 Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 تثبيت الحزم
        run: npm ci

      - name: 🛠️ تجهيز غلاف Capacitor
        run: |
          npm i -D @capacitor/cli @capacitor/core @capacitor/android
          mkdir -p out
          cp public/icon.svg out/icon.svg 2>/dev/null || true
          npx cap add android
          npx cap sync android
        env:
          CAPACITOR_CONFIG: "1"

      - name: ⚙️ كتابة إعداد Capacitor برابط التطبيق
        run: |
          if [ -z "$APP_URL" ]; then
            echo "⚠️ لم يُضبط APP_URL — سيبنى التطبيق بدون رابط (وضع العرض فقط)"
          fi
          cat > capacitor.config.json <<EOF
          {
            "appId": "app.midad.notes",
            "appName": "مِداد",
            "webDir": "out",
            "server": {
              "url": "${APP_URL:-https://example.com}",
              "cleartext": false,
              "androidScheme": "https"
            },
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap sync android

      - name: 🔨 بناء APK (Debug — جاهز للتثبيت المباشر)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: ⬆️ رفع ملف APK كمخرج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: midad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── نسخة Release موقعة (اختياري) ──────────────────────
      # فعّلها بإضافة الأسرار التالية في المستودع:
      #   ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: 🔐 تجهيز التوقيع (اختياري)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: 🏷️ بناء Release موقّع (اختياري)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: ⬆️ رفع نسخة Release (اختياري)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: midad-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
