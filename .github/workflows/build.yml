name: StarNote Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node deps
        run: npm ci --no-audit --no-fund || npm install

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_BASE: https://api.starnote.app
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Init Capacitor
        run: |
          npx cap init "StarNote" "com.starnote.app" --web-dir=.next || true
          npx cap add android || true
          npx cap sync android || true

      - name: Gradle Permissions
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            -Dorg.gradle.parallel=true

      - name: Build Release APK
        working-directory: android
        continue-on-error: true
        run: |
          ./gradlew :app:assembleRelease \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            -Dorg.gradle.parallel=true

      - name: Find APKs
        if: always()
        working-directory: android
        run: |
          echo "Debug APKs:"
          find . -name "*debug*.apk" -type f -exec ls -lh {} \;
          echo ""
          echo "Release APKs:"
          find . -name "*release*.apk" -type f -exec ls -lh {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starnote-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starnote-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: ./apks/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
