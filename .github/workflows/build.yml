
name: 🤖 StarNote Android Build

on:
  # بناء تلقائي عند الدفع للفروع الرئيسية
  push:
    branches:
      - main
      - master
      - develop

  # بناء عند Pull Request
  pull_request:
    branches:
      - main
      - master

  # بناء يدوي من GitHub Actions
  workflow_dispatch:
    inputs:
      build_variant:
        description: "نوع البناء"
        required: false
        default: "apk"
        type: choice
        options:
          - apk          # APK فقط
          - aab          # AAB فقط (Google Play)
          - both         # كلاهما

