name: StarNote Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node deps
        run: npm ci --no-audit --no-fund || npm install

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_BASE: https://api.starnote.app
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Install Capacitor
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Create Capacitor Project
        run: |
          echo "Creating Capacitor project..."
          npx cap init "StarNote" "com.starnote.app" --web-dir=.next || true

      - name: Add Android Platform
        run: |
          echo "Adding Android platform..."
          npx cap add android || echo "Android already exists"

      - name: Sync Capacitor
        run: |
          echo "Syncing Capacitor..."
          npx cap sync android || true

      - name: Verify Android Folder
        run: |
          echo "Checking android folder..."
          ls -la android/ || echo "Creating android folder structure..."
          if [ ! -d "android" ]; then
            echo "ERROR: android folder not created!"
            exit 1
          fi
          ls -la android/

      - name: Set Gradle Permissions
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "✓ Gradle permissions set"
          else
            echo "WARNING: gradlew not found, will create it"
            cd android && ./gradlew --version || gradle --version
          fi

      - name: Build Debug APK
        run: |
          cd android
          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleDebug \
              --stacktrace \
              --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx4g" \
              -Dorg.gradle.parallel=true
          else
            echo "ERROR: gradlew not found!"
            ls -la
            exit 1
          fi

      - name: Build Release APK
        continue-on-error: true
        run: |
          cd android
          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleRelease \
              --stacktrace \
              --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx4g" \
              -Dorg.gradle.parallel=true
          else
            echo "WARNING: gradlew not found for release build"
          fi

      - name: Find APKs
        if: always()
        run: |
          echo "Looking for APK files..."
          find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starnote-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starnote-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: ./apks/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
